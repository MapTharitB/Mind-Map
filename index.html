<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MindMapOutliner</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Canonical host theme: the eight original Outliner color tokens. */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;
--bg:hsl(222 25% 16%);--page:#14224a;--ink:#e6ecf7;--mute:#8b9bb8;--line:#27375f;--accent:#4cc9cc;--halo:#1f2f58;--btn:#182855}
:root{--control-selected-bg:color-mix(in srgb,var(--accent) 18%,var(--btn));--control-selected-ink:#fff;--control-selected-hover-bg:color-mix(in srgb,var(--accent) 26%,var(--btn))}
/* Canonical localized map glass; R12 header/Search use Outliner tokens. */
:root{--map-glass-bg:rgba(0,0,0,.28);--map-hud-bg:rgba(0,0,0,.32);--map-glass-ink:rgba(255,255,255,.6);--map-hud-ink:rgba(255,255,255,.5);--map-glass-hover:rgba(0,0,0,.46);--map-glass-pressed:rgba(0,0,0,.55);--map-glass-blur:8px;--map-glass-radius:6px;--map-glass-pill:100px;--map-sync-border:rgba(255,255,255,.18);--map-panel-bg:rgba(28,34,47,.94)}
/* iPad: paint the canvas through the bottom safe area; chrome applies that inset once. */
html.ipad-safari-shell{padding-bottom:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;height:100%;display:flex;flex-direction:column;overflow:hidden}
[hidden]{display:none!important}

.shell-button{font:inherit;font-size:13px;background:var(--btn);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.shell-button:hover,.shell-button:focus-visible{border-color:var(--accent)}
.shell-button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.shell-button:disabled{cursor:default;opacity:.5}
#errors{position:fixed;left:14px;bottom:14px;max-width:calc(100% - 28px);max-height:20vh;overflow:auto;z-index:60;pointer-events:none}
#errors p{margin:0;padding:6px 14px;font-size:13px;line-height:20px;border-bottom:1px solid var(--line);background:var(--page);overflow-wrap:anywhere}
#workspace{flex:1;min-height:0;min-width:0;position:relative;isolation:isolate}
#outline-host{position:absolute;left:0;top:0;bottom:0;min-width:0;min-height:0;width:35%;background:var(--bg);z-index:30;padding-left:env(safe-area-inset-left,0px)}
#outline-host{pointer-events:none}
#outline-host .page>* ,#outline-host .menu{pointer-events:auto}
#map-pane,#map-host{position:absolute;inset:0;min-width:0;min-height:0}
#map-host{--map-control-right:calc(16px + env(safe-area-inset-right,0px));--map-hud-top:auto;--map-hud-bottom:14px;--map-hud-max-width:none;--map-hud-height:24px;--map-reset-width:112px;--map-reset-height:44px}
.map-controls{position:absolute;inset:0;pointer-events:none;z-index:25}
.map-controls>button{position:absolute;right:calc(16px + env(safe-area-inset-right,0px));pointer-events:auto}
.map-controls.short-controls{left:auto;width:min(144px,100%);overflow-y:auto;pointer-events:auto}
.map-controls.short-controls::after{content:"";display:block;height:128px}
.map-controls.short-controls #map-options{position:fixed;max-width:calc(100vw - 32px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px))}
#map-more{top:14px;width:44px;height:44px;padding:0;display:flex;align-items:center;justify-content:center;background:var(--map-glass-bg);color:var(--map-glass-ink);border-color:var(--map-sync-border);backdrop-filter:blur(var(--map-glass-blur));-webkit-backdrop-filter:blur(var(--map-glass-blur))}
@media(hover:hover){#map-more:hover{background:var(--map-glass-hover)}}
#map-more:active{background:var(--map-glass-pressed)}
.r12-supplied{display:flex;align-items:center;gap:8px;width:100%;min-width:222px}
.brand{display:flex;align-items:center;gap:10px;flex:none;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;white-space:nowrap}
.brand-mark{width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:#4f7ef8;color:#fff;border-radius:8px;font-size:16px;font-weight:800}
.brand-copy{display:flex;flex-direction:column;gap:4px;line-height:1}
.brand-title{font-size:13px;font-weight:600}.brand-credit{font-size:8px;font-weight:400;color:var(--mute)}
.brand-title-only .brand-credit,.brand-icon .brand-copy{display:none}
.sync-group{display:flex;gap:4px;flex:none;margin-left:auto}
.sync-group .shell-button{height:44px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:transparent;color:color-mix(in srgb,var(--ink) 35%,var(--btn));font:400 12px 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;white-space:nowrap;cursor:pointer}
/* Shared sync states: touch hover must not override OFF; keyboard focus keeps its visible ring. */
@media(hover:hover){.sync-group .shell-button:enabled:hover{background:var(--halo);border-color:var(--line);color:var(--ink)}.sync-group .shell-button:enabled[aria-pressed=true]:hover{background:var(--control-selected-hover-bg);border-color:transparent;color:var(--control-selected-ink)}}
.sync-group .shell-button[aria-pressed=true]{background:var(--control-selected-bg);border-color:transparent;color:var(--control-selected-ink)}
.sync-group button:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}
.brand-icon .sync-group{flex:1}.brand-icon .sync-group button{flex:1;width:0!important}
.short-sync .long-label{display:none}.short-sync .short-label{display:inline}
.brand-measure{position:absolute;visibility:hidden;pointer-events:none;width:max-content;display:flex;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
#corner-toggle{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));top:14px;width:44px;height:44px;z-index:33;padding:0;display:flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:7px;background:transparent;color:rgba(80,78,90,.45);line-height:0;cursor:pointer}
@media(hover:hover){#corner-toggle:hover{color:rgba(60,58,80,.78);background:rgba(0,0,0,.07);border-color:rgba(0,0,0,.07)}}
#corner-toggle:active{background:rgba(0,0,0,.13);color:rgba(40,38,60,.85)}
#corner-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
#map-options{position:absolute;right:calc(16px + env(safe-area-inset-right,0px));top:66px;z-index:25;pointer-events:auto;background:var(--map-panel-bg);color:var(--ink);border:1px solid var(--map-sync-border);border-radius:8px;padding:12px;width:max-content;max-width:calc(100% - 32px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));max-height:calc(100% - 80px);overflow:auto;backdrop-filter:blur(var(--map-glass-blur));-webkit-backdrop-filter:blur(var(--map-glass-blur));font-size:13px}
.option-label{font-size:10px;letter-spacing:.08em;color:var(--mute)}
.stepper{position:relative;display:flex;align-items:center;min-width:0;height:40px;border:1px solid var(--line);border-radius:6px;background:var(--btn);justify-self:start}
.stepper:focus-within{border-color:var(--accent)}
.stepper input{width:70px;min-width:0;flex:0 0 auto;height:38px;border:0;background:transparent;color:var(--ink);text-align:center;font:13px 'Cascadia Code','JetBrains Mono',monospace;padding:0;outline:0;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.stepper button{position:relative;flex:0 0 30.8px;width:30.8px;height:40px;margin:-1px 0;padding:0;background:none;color:var(--mute);border:0;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.stepper button:first-child{border-right:1px solid var(--line)}.stepper button:last-child{border-left:1px solid var(--line)}
.stepper button:focus-visible{outline:1px solid var(--accent);outline-offset:-3px}
.stepper :disabled{opacity:.35;cursor:not-allowed}
.wrap-check{display:flex;align-items:center;justify-content:center;flex:0 0 40px;width:40px;height:40px;padding:0;align-self:center}
.wrap-check input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
#map-options .sep{border-top:1px solid var(--map-sync-border);margin:16px 0}
#map-options .shell-button{height:40px;margin:0;padding:0 8px;width:100%;font-size:12px}
#map-options .square-reset{width:40px;display:flex;align-items:center;justify-content:center;padding:0}
#download-pdf{display:block}
#divider{position:absolute;top:0;bottom:0;width:var(--divider-target-width,12px);z-index:24;cursor:ew-resize;touch-action:none;outline:0}
#divider::after{content:"";position:absolute;top:0;bottom:0;left:var(--divider-line-left,5px);width:2px;background:var(--line)}
#divider:hover::after,#divider:focus-visible::after,.resizing #divider::after{background:var(--accent)}
.resizing{cursor:ew-resize;user-select:none;-webkit-user-select:none}
.short-label{display:none}
.legacy-sync{position:absolute;right:16px;top:66px;z-index:22;width:auto;min-width:0!important}.legacy-sync .brand{display:none}.legacy-sync .sync-group button{width:auto!important}
.legacy-sync~#corner-toggle{z-index:33}


/* Approved compact layout menu: all rows share label / control / checkbox columns. */
#settings-controls:not([hidden]){display:grid;grid-template-columns:48px minmax(0,1fr) 40px;row-gap:8px;column-gap:12px;margin-bottom:8px}
#settings-controls .option-row,#settings-controls .wrap-controls{display:contents}
#settings-controls .option-row[hidden]{display:none}
#settings-controls .option-label{white-space:nowrap;align-self:center}
#settings-controls .section-title,#settings-controls .leaf-option,#settings-controls>.sep{grid-column:1/-1}
#settings-controls>.sep{margin:2px 0}
.section-title{font-size:12px;color:var(--ink)}
#settings-controls .section-title[hidden]{display:none}

/* Native radios in a shared button surface; selection uses fill, not a bright edge. */
.root-order{grid-column:1/-1;display:flex;min-width:0;height:31px;margin:0;padding:2px;gap:2px;border:1px solid var(--line);border-radius:7px;background:var(--btn)}
.root-order label{position:relative;display:flex;flex:1 1 50%;min-width:0;align-items:center;justify-content:center;cursor:pointer;font-size:12px}
.root-order input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.root-order span{display:flex;align-items:center;justify-content:center;align-self:stretch;width:100%;border-radius:4px;color:var(--mute);white-space:nowrap}
@media(hover:hover){.root-order input:not(:checked):not(:disabled)+span:hover{background:var(--halo);color:var(--ink)}}
.root-order input:checked+span{background:var(--control-selected-bg);color:var(--control-selected-ink)}
.root-order input:focus-visible+span{outline:2px solid var(--ink);outline-offset:-2px}
.root-order input:disabled+span{opacity:.5;cursor:default}
/* Seed alone reserves its eight digits plus comfortable ink clearance. */
#map-options #color-seed{width:calc(8ch + 18px);min-width:calc(8ch + 18px);padding:0 8px}
.leaf-option{display:flex;align-items:center;gap:8px;min-height:40px;max-width:100%;cursor:pointer}
.leaf-option input{flex:none;width:18px;height:18px;margin:0;accent-color:var(--accent)}
.leaf-option:has(:disabled){color:var(--mute);cursor:default}
</style>
</head>
<body>
<div id="errors" role="status" aria-live="polite"></div>
<main id="workspace">
  <section id="outline-host" aria-label="Outliner"></section>
  <div id="divider" role="separator" aria-label="Outline pane width" aria-orientation="vertical" aria-controls="outline-host" tabindex="0"></div>
  <section id="map-pane" aria-label="Mind Map">
    <div class="map-controls" hidden>
      <button id="map-more" class="shell-button" aria-label="Mind Map Layout" aria-expanded="false" aria-controls="map-options">⋯</button>
      <div id="map-options" hidden>
        <div id="settings-controls" hidden>
          <div class="section-title scale-option" hidden>Branch Scale</div>
          <div class="option-row scale-option" hidden><label class="option-label" for="branch-scale">Scale</label><div class="stepper"><button id="scale-down" aria-label="Decrease Branch Scale">‹</button><input id="branch-scale" aria-label="Branch Scale" type="number" inputmode="decimal" min="1" max="5" step="0.01" value="2.5"><button id="scale-up" aria-label="Increase Branch Scale">›</button></div><button id="scale-reset" class="shell-button square-reset" aria-label="Reset Branch Scale">Reset</button></div>
          <div class="sep scale-option" hidden></div>
          <div class="section-title root-option" hidden>Mind Map Layout</div>
          <div class="option-row root-option" hidden><label class="option-label" for="root-count">Wrap</label><div class="wrap-controls"><div class="stepper"><button id="root-down" aria-label="Decrease Mind Map Wrap Count">‹</button><input id="root-count" aria-label="Mind Map Wrap Count" type="number" inputmode="numeric" min="1" step="1" value="3"><button id="root-up" aria-label="Increase Mind Map Wrap Count">›</button></div><label class="wrap-check"><input id="root-enabled" type="checkbox" aria-label="Enable Mind Map Wrap"></label></div></div>
          <div id="root-order" class="root-order" role="radiogroup" aria-label="Mind Map Root Order" hidden><label><input type="radio" name="root-order" id="root-order-down" value="down" checked><span>Down Columns</span></label><label><input type="radio" name="root-order" id="root-order-across" value="across"><span>Across Rows</span></label></div>
          <div class="sep root-option" hidden></div>
          <div class="section-title">First-Level Branches</div>
          <div class="option-row"><label class="option-label" for="hlimit-count">Wrap</label><div class="wrap-controls"><div class="stepper"><button id="wrap-down" aria-label="Decrease First-Level Wrap Count">‹</button><input id="hlimit-count" aria-label="First-Level Wrap Count" type="number" inputmode="numeric" min="1" step="1" value="3"><button id="wrap-up" aria-label="Increase First-Level Wrap Count">›</button></div><label class="wrap-check"><input id="hlimit-enabled" type="checkbox" aria-label="Enable First-Level Wrap"></label></div></div>

          <div class="sep"></div>
          <div class="section-title branch-option" hidden>Deeper Branches</div>
          <div class="option-row branch-option" hidden><label class="option-label" for="deeper-levels">Levels</label><div class="stepper"><button id="levels-down" aria-label="Decrease Levels">‹</button><input id="deeper-levels" aria-label="Levels" type="number" inputmode="numeric" min="1" step="1" value="1"><button id="levels-up" aria-label="Increase Levels">›</button></div><label class="wrap-check"><input id="deeper-enabled" type="checkbox" aria-label="Enable Deeper Branches"></label></div>
          <label class="leaf-option" hidden><input id="allow-horizontal-leaves" type="checkbox" checked><span>Allow Horizontal Leaves</span></label>
          <div class="section-title branch-option" hidden>Limit</div>
          <div class="option-row branch-option" hidden><label class="option-label" for="sibling-count">Amount</label><div class="stepper"><button id="limit-down" aria-label="Decrease sibling limit">‹</button><input id="sibling-count" aria-label="Maximum siblings in a horizontal group" type="number" inputmode="numeric" min="1" step="1" value="3"><button id="limit-up" aria-label="Increase sibling limit">›</button></div><label class="wrap-check"><input id="sibling-enabled" type="checkbox" aria-label="Enable sibling limit"></label></div>
          <div class="option-row length-option" hidden><label class="option-label" for="length-ratio">Length</label><div class="stepper"><button id="length-down" aria-label="Decrease Length">‹</button><input id="length-ratio" aria-label="Maximum branch length ratio" type="number" inputmode="decimal" min="1" max="10" step="0.01" value="1.5"><button id="length-up" aria-label="Increase Length">›</button></div><label class="wrap-check"><input id="length-enabled" type="checkbox" aria-label="Enable Length limit"></label></div>
          <div class="sep"></div>
          <div class="option-row"><span class="option-label">Color</span><button id="random-color" class="shell-button">Random</button><span aria-hidden="true"></span></div>
          <div class="option-row"><label class="option-label" for="color-seed">Seed</label><div class="stepper"><button id="seed-down" aria-label="Decrease Seed">‹</button><input id="color-seed" type="number" inputmode="numeric" min="0" max="16777215" step="1" value="0"><button id="seed-up" aria-label="Increase Seed">›</button></div><button id="seed-reset" class="shell-button square-reset" aria-label="Reset Color Seed">Reset</button></div>
          <div class="sep"></div>
        </div>
        <button id="download-pdf" class="shell-button" hidden>Download PDF</button>
      </div>
    </div>
    <div id="map-host"></div>
    <button id="corner-toggle" aria-label="Toggle Sidebar" title="Toggle Sidebar" hidden><svg width="18" height="14" viewBox="0 0 18 14" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="shell-tog-glow" x="-80%" y="-20%" width="260%" height="140%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <rect x="0.75" y="0.75" width="16.5" height="12.5" rx="2.25" stroke="currentColor" stroke-width="1.5"/>
    <line x1="6.5" y1="0.75" x2="6.5" y2="13.25" stroke="currentColor" stroke-width="1.5"/>
  </svg></button>
  </section>
</main>
<script>
(function(){
'use strict';
// Same best-effort identity as standalone Outliner; no extra module API or global.
const ipadSafariShell = navigator.maxTouchPoints > 1 &&
  (/iPad/i.test(navigator.userAgent) || navigator.platform === 'MacIntel' && /Macintosh/i.test(navigator.userAgent)) &&
  /AppleWebKit/i.test(navigator.userAgent) && /Version\//i.test(navigator.userAgent) && /Safari\//i.test(navigator.userAgent) &&
  !/CriOS|FxiOS|EdgiOS|OPiOS|Chrome|Chromium|Android|Edg\/|OPR\//i.test(navigator.userAgent);
if(ipadSafariShell)document.documentElement.classList.add('ipad-safari-shell');
/* MODULES — edit only these entries to choose independent releases.
   Relative sources get an encoded v query. Absolute HTTPS pins stay unchanged.
   A tag or full commit is a pin; @main/@latest is floating. No fallback version. */
const MODULES = {
  outliner: { src: './outliner.js', v: '1.14.0' },
  mindmap: { src: './mindmap.js', v: '1.14.8' }
};
// BEGIN SYNC FILTER
function projectOutline(snapshot, syncCollapse, syncFocus, pinnedId = null, presentationSupported = true) {
  if (!snapshot || !Array.isArray(snapshot.tree)) throw new TypeError('Invalid outline snapshot');
  let zoomNode = null, pinnedNode = null;
  const seen = new Set(), nodes = [], search = snapshot.tree.slice().reverse();
  while (search.length) {
    const node = search.pop();
    if (!node || typeof node !== 'object' || !Number.isInteger(node.id) || typeof node.text !== 'string' || typeof node.open !== 'boolean' || !Array.isArray(node.children) || seen.has(node.id)) throw new TypeError('Invalid outline node');
    if(node.titleLineCount!==undefined&&(!Number.isSafeInteger(node.titleLineCount)||node.titleLineCount<1||node.titleLineCount>node.text.split('\n').length||node.kind==='spacer'))throw new TypeError('Invalid node title-line metadata');
    seen.add(node.id);nodes.push(node);
    if (node.id === snapshot.zoomId) zoomNode = node;
    if (node.id === pinnedId) pinnedNode = node;
    for (let i = node.children.length - 1; i >= 0; i--) search.push(node.children[i]);
  }
  // R11: prune the full tree bottom-up before focus/collapse; never mutate source nodes.
  const surviving = new Set(), placeholders = new Set();
  for (let i = nodes.length - 1; i >= 0; i--) {
    const node = nodes[i], empty = !(node.titleLineCount>1)&&!node.text.replace(/\u200B/g, '').trim();
    if(node.kind==='spacer'&&!presentationSupported)continue;
    if (node.kind==='spacer' || !empty || node.children.some(child => surviving.has(child))) {
      surviving.add(node);if (empty&&node.kind!=='spacer') placeholders.add(node);
    }
  }
  // A valid zoom target pruned as an empty leaf means blank, not Home fallback.
  const start = pinnedNode ? [pinnedNode] : syncFocus && zoomNode ? [zoomNode] : snapshot.tree;
  const collapseAnchor = pinnedNode || zoomNode;
  const included=node=>node.kind!=='spacer',canonicalRoots=snapshot.tree.filter(included);
  const outlineStats={maxDepth:0,maxSiblings:0,rootCount:canonicalRoots.length,maxFirstLevel:Math.max(0,...canonicalRoots.map(node=>node.children.filter(included).length))},metrics=canonicalRoots.map(node=>({node,depth:0}));
  while(metrics.length){const {node,depth}=metrics.pop(),children=node.children.filter(included);if(node.kind!=='spacer')outlineStats.maxDepth=Math.max(outlineStats.maxDepth,depth);outlineStats.maxSiblings=Math.max(outlineStats.maxSiblings,children.length);for(const child of children)metrics.push({node:child,depth:depth+1});}
  const stack = [], lines = [], placeholderNodes = [], nodeTexts = [], nodeTitleLines = [], nodePresentation = [], nodeHasChildren = [];
  for (let i = start.length - 1; i >= 0; i--) stack.push({node:start[i], depth:0});
  while (stack.length) {
    const {node, depth} = stack.pop();
    if (!surviving.has(node)) continue;
    const placeholder = placeholders.has(node);
    const label = node.kind==='spacer'?'\u2063':placeholder ? '(Untitled)' : node.text.replace(/\r\n?|\n/g, ' ');

    lines.push('  '.repeat(depth) + '- ' + label); nodeTexts.push(node.text);nodeTitleLines.push(node.titleLineCount??1);nodeHasChildren.push(node.kind!=='spacer'&&node.children.some(child=>child.kind!=='spacer'));nodePresentation.push({mapSize:node.mapSize??1,kind:node.kind==='spacer'?'spacer':'node'});

      for (let i = node.children.length - 1; i >= 0; i--) stack.push({node:node.children[i], depth:depth+1});
    }

  return {text:lines.join('\n'), placeholderNodes, nodeTexts, nodeTitleLines, nodePresentation, nodeHasChildren, outlineStats};
}
// END SYNC FILTER
const $ = id => document.getElementById(id);
const workspace=$('workspace'), outlineHost=$('outline-host'), mapPane=$('map-pane'), divider=$('divider');

$('root-enabled').addEventListener('change',()=>{if(!$('root-enabled').disabled)changeSettings({rootLayout:{enabled:$('root-enabled').checked}});});
$('hlimit-enabled').addEventListener('change',()=>{if(!$('hlimit-enabled').disabled)changeSettings({horizontalLimit:{enabled:$('hlimit-enabled').checked,count:$('hlimit-count').value}});});
$('allow-horizontal-leaves').addEventListener('change',event=>{if(!event.target.disabled)changeSettings({deeperHorizontal:{allowLeaves:event.target.checked}});});
$('deeper-enabled').addEventListener('change',()=>{if(!$('deeper-enabled').disabled)changeSettings({deeperHorizontal:{enabled:$('deeper-enabled').checked}});});
$('sibling-enabled').addEventListener('change',()=>{if(!$('sibling-enabled').disabled)changeSettings({siblingLimit:{enabled:$('sibling-enabled').checked}});});
const layoutNumbers={
  'root-count':{key:'rootLayout',field:'count',down:'root-down',up:'root-up'},
  'hlimit-count':{key:'horizontalLimit',field:'count',down:'wrap-down',up:'wrap-up'},
  'deeper-levels':{key:'deeperHorizontal',field:'levels',down:'levels-down',up:'levels-up'},
  'sibling-count':{key:'siblingLimit',field:'count',down:'limit-down',up:'limit-up'}
};
function readSettingBounds(key){
  const capability=key==='rootLayout'?'root-layout-v1':key==='horizontalLimit'?'settings-bounds':'branch-layout-v1';
  if(!supports(capability,'getSettingBounds'))return null;
  const value=mapCall('getSettingBounds'),bound=value&&value[key];
  if(key==='horizontalLimit'&&!(Number.isInteger(bound?.max)&&bound.max>=1))return null;
  return bound||null;
}
function settingBounds(){
  return readSettingBounds('horizontalLimit')||{min:1,max:Infinity}; // Older modules enforce their own cap through setSettings.
}
function updateSettingButtons(){
  const bounds=settingBounds(),count=settings.horizontalLimit.count,off=!settings.horizontalLimit.enabled,seed=settings.colorSeed;
  $('hlimit-count').max=Number.isFinite(bounds.max)?bounds.max:'';
  $('wrap-down').disabled=off||$('hlimit-count').disabled||count<=1;$('wrap-up').disabled=off||$('hlimit-count').disabled||count>=bounds.max;
  for(const [id,row] of Object.entries(layoutNumbers)){
    if(id==='hlimit-count')continue;
    const input=$(id),bound=readSettingBounds(row.key),value=row.key==='rootLayout'?bound?.effectiveCount:settings[row.key]?.[row.field];
    input.max=bound?bound.max:'';$(row.down).disabled=input.disabled||!bound||value<=bound.min;$(row.up).disabled=input.disabled||!bound||value>=bound.max;
  }
  $('seed-down').disabled=seed<=0;$('seed-up').disabled=seed>=16777215;
}
function commitNumber(id,delta=0){
  if(seedHistory.enabled&&id==='color-seed'){
    if(seedHistory.composing)return;
    const text=$('color-seed').value.trim(),number=Number(text);
    if(!text||!Number.isFinite(number)){seedHistory.settleSeedDraft();return;}
    seedHistory.commitSeed(Math.max(0,Math.min(16777215,Math.round(number)+delta)));return;
  }
  const input=$(id);if(input.disabled)return;
  const value=input.value.trim(),number=Number(value),row=layoutNumbers[id];
  if(row){
    if(!value||!Number.isFinite(number)||!Number.isSafeInteger(Math.round(number))){refreshSettings();return;}
    const bound=readSettingBounds(row.key)||{min:1,max:Infinity};
    const next=Math.max(bound.min,Math.min(bound.max,Math.round(number)+delta));
    changeSettings({[row.key]:{[row.field]:next}});return;
  }
  if(!value||!Number.isFinite(number)){refreshSettings();return;}
  const seed=id==='color-seed',max=seed?16777215:settingBounds().max;
  const next=Math.max(seed?0:1,Math.min(max,Math.round(number)+delta));
  changeSettings(seed?{colorSeed:next}:{horizontalLimit:{count:next}});
}
for(const id of [...Object.keys(layoutNumbers),'color-seed']){
  $(id).addEventListener('change',()=>commitNumber(id));
  $(id).addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.isComposing&&event.keyCode!==229){event.preventDefault();commitNumber(id);}});
}
// Compatibility clicks and held controls share the same button/input/direction table.
const integerButtons=[...Object.entries(layoutNumbers).flatMap(([input,row])=>[[row.down,input,-1],[row.up,input,1]]),['seed-down','color-seed',-1],['seed-up','color-seed',1]];
for(const [id,input,delta]of integerButtons)$(id).addEventListener('click',()=>{if(!numericFactory)commitNumber(input,delta);});
$('seed-reset').addEventListener('click',()=>{
  if(seedHistory.enabled){if(!seedHistory.settleSeedDraft())return;seedHistory.commitSeed(0);}
  else changeSettings({colorSeed:0});
});
$('random-color').addEventListener('click',()=>{
  if(seedHistory.enabled){if(!seedHistory.settleSeedDraft())return;seedHistory.commitSeed(Math.floor(Math.random()*0xFFFFFF),true);}
  else changeSettings({colorSeed:Math.floor(Math.random()*0xFFFFFF)});
});
$('download-pdf').addEventListener('click',async()=>{
  const button=$('download-pdf');button.disabled=true;
  try {flushSync();await mapCall('exportPDF');refreshSettings();} catch(error) {report('Mind Map',error);} finally {button.disabled=false;}
});
let numericFactory=null,seedAdjustmentToken=null,scalePreview=null,scalePreviewTimer=null,lastScalePreview=0;
const numericHolds=[];
function deliverScale(final=false){
  if(final){clearTimeout(scalePreviewTimer);scalePreviewTimer=null;}
  if(scalePreview===null)return;
  const elapsed=performance.now()-lastScalePreview;
  if(!final&&elapsed<50){if(!scalePreviewTimer)scalePreviewTimer=setTimeout(()=>{scalePreviewTimer=null;deliverScale();},50-elapsed);return;}
  const value=scalePreview;scalePreview=null;lastScalePreview=performance.now();commitScale(0,value);
}
function bindNumericControls(module){
  if(!module.capabilities.includes('numeric-stepper-v1')||typeof module.createNumericStepper!=='function')return;
  numericFactory=module.createNumericStepper;
  if(module.capabilities.includes('numeric-select-all-v1')&&typeof module.bindNumericInputs==='function')numericHolds.push(module.bindNumericInputs($('map-options')));
  const entries=[...integerButtons,['scale-down','branch-scale',-1],['scale-up','branch-scale',1],['length-down','length-ratio',-1],['length-up','length-ratio',1]];
  for(const [id,inputId,direction]of entries){
    const input=$(inputId),scale=inputId==='branch-scale';
    const binding=numericFactory({button:$(id),direction,scale,allowed:()=>!input.disabled&&!seedHistory.composing&&!scaleComposing&&!lengthComposing&&!$('map-options').hidden,
      read:()=>inputId==='branch-scale'&&scalePreview!==null?scalePreview:Number(input.value),bounds:()=>({min:Number(input.min),max:input.max===''?Infinity:Number(input.max)}),
      step:(delta=direction,count=1)=>scale?commitScale(delta*count*10):inputId==='length-ratio'?commitLength(delta*count*10):commitNumber(inputId,delta*count),
      write:value=>{scalePreview=value;input.value=String(value);deliverScale();},
      start:()=>{if(inputId==='color-seed'&&seedHistory.enabled){if(!seedHistory.settleSeedDraft())return false;seedAdjustmentToken=outline.beginHostAdjustment?.();seedHistory.setAdjustment(seedAdjustmentToken);return !!seedAdjustmentToken;}return true;},
      finish:()=>{if(inputId==='branch-scale')deliverScale(true);if(inputId==='color-seed'){outline?.endHostAdjustment?.(seedAdjustmentToken);seedHistory.setAdjustment(null);seedAdjustmentToken=null;}}
    });
    numericHolds.push({...binding,input});
  }
}
function moduleURL(config) {
  const url=new URL(config.src,document.baseURI);
  if(/^https:\/\//i.test(config.src))return url.href;
  if(/^[a-z][a-z0-9+.-]*:/i.test(config.src) || config.src.startsWith('//'))throw new Error('Use a relative source or an explicit HTTPS module URL');
  url.search+=(url.search?'&':'?')+'v='+encodeURIComponent(config.v);
  return url.href;
}
function loadModule(name, globalName) {
  return new Promise((resolve,reject)=>{
    let url;try {url=moduleURL(MODULES[name]);}catch(error){reject(error);return;}
    const script=document.createElement('script');script.async=false;script.src=url;
    let settled=false;
    const timer=setTimeout(()=>finish(new Error(url+' timed out after 15 seconds')),15000);
    function finish(error) {
      if(settled)return;settled=true;clearTimeout(timer);script.onload=null;script.onerror=null;
      if(error){script.remove();reject(error);return;}
      const module=window[globalName];
      if(!module || !Number.isInteger(module.apiVersion) || module.apiVersion!==1 || typeof module.mount!=='function' || !Array.isArray(module.capabilities)){reject(new Error(url+' has a missing global or incompatible API (requires apiVersion 1, mount and capabilities)'));return;}
      resolve(module);
    }
    script.onload=()=>finish();script.onerror=()=>finish(new Error(url+' could not load (missing file, network or script failure)'));
    document.head.appendChild(script);
  });
}
async function start() {
  try {
    const module=await loadModule('outliner','Outliner');
    if(!module.capabilities.includes('node-title-lines'))throw new Error('Outliner compatibility error: this shell requires a node-title-lines capable module. Reload the matching app files before editing saved multiline titles.');
    const wantsPaneControls=module.capabilities.includes('pane-controls');
    const wantsHeader=wantsPaneControls&&module.capabilities.includes('header-content');
    headerContent.hidden=!wantsHeader;
    const wantsHistory=module.capabilities.includes('host-history');
    const historyOptions=wantsHistory?{historyHost:composeHistoryHost(module)}:{};
    outline=module.mount(outlineHost,{...historyOptions,...(wantsPaneControls?{paneControls:true,...(wantsHeader?{headerContent}:{})}:{})});
    if(wantsPaneControls&&outline&&typeof outline.setPaneMode!=='function'&&typeof outline.destroy==='function'){
      outline.destroy();headerContent.hidden=true;workspace.append(headerContent);outline=module.mount(outlineHost,historyOptions);
    }
    if(!outline || typeof outline.getSnapshot!=='function' || typeof outline.on!=='function' || !['snapshot-v1','change-event','toggle-event','zoom-event'].every(cap=>module.capabilities.includes(cap)))throw new Error('Outliner live sync contract is incomplete');
    seedHistory.enable(wantsHistory&&typeof outline.commitHostHistory==='function'&&typeof outline.runHistory==='function');
    if(wantsHistory&&!seedHistory.enabled){
      outline.destroy();seedHistory.dispose();
      outline=module.mount(outlineHost,wantsPaneControls?{paneControls:true,...(wantsHeader?{headerContent}:{})}:{});
    }
    if(seedHistory.enabled){$('color-seed').value=seedHistory.display;const destroy=outline.destroy;outline.destroy=()=>{numericHolds.forEach(b=>b.dispose());seedHistory.dispose();destroy();};}
    const hasPin=module.capabilities.includes('pin-focus-menu-v1')&&module.capabilities.includes('outline-focus-history-v1')&&seedHistory.enabled&&typeof outline.setPinnedFocus==='function';
    if(hasPin)outline.on('pinFocus',mapFocus.request);
    mapFocus.initialize(outline.getSnapshot({titleLines:true}),hasPin);
    ['change','toggle','zoom'].forEach(event=>outline.on(event,scheduleSync));
    if(module.capabilities.includes('expansion-level-event-v1'))outline.on('expansionLevel',()=>setSyncCollapse(true));
    if(module.capabilities.includes('search-query-v1')&&typeof outline.getSearchQuery==='function'){
      outline.on('search',receiveSearch);

    if(!map || !supports('text-input','setText'))throw new Error('Mind Map text-input capability/method is missing');

    for(const id of ['random-color','color-seed'])$(id).closest('.option-row').hidden=!hasSeed;
    $('settings-controls').hidden=!hasSettings;$('download-pdf').hidden=!hasPDF;$('map-more').hidden=!(hasSettings||hasPDF);
    document.querySelector('.map-controls').hidden=false;
    if(headerContent.hidden){headerContent.hidden=false;headerContent.classList.add('legacy-sync');mapPane.append(headerContent);}
    measureBrand();
    layout();
    if(hasSettings && !outline && mapVisible()){settingsPending=false;persistSettings(mapCall('setSettings',settings));}
  } catch(error) {report('Mind Map',error);}
}
syncButtons();measureWorkspace();start().catch(error=>report('Shell',error));
})();
