/* ══ HISTORY ══ */
const hist={stack:[{text:'',seed:0,phantom:true}],ptr:0};
let _lastPushMs=0;
const COALESCE_MS=800;
function hpush(text,seed){
  const phantom=!uiState.hasEverTyped;
  const cur=hist.stack[hist.ptr];
  if(cur.text===text&&cur.seed===seed&&!!cur.phantom===phantom)return;
  const now=Date.now(),atTop=hist.ptr===hist.stack.length-1;
  if(atTop&&now-_lastPushMs<COALESCE_MS&&hist.stack.length>1&&!!cur.phantom===phantom){
    hist.stack[hist.ptr]={text,seed,phantom};
  }else{
    hist.stack=hist.stack.slice(0,hist.ptr+1);
    hist.stack.push({text,seed,phantom});hist.ptr=hist.stack.length-1;
    if(hist.stack.length>300){hist.stack.shift();hist.ptr--;}
  }
  _lastPushMs=Date.now();syncH();
}
function hpushBreak(text,seed){_lastPushMs=0;hpush(text,seed);}
function _applyEntry(e){
  ta.value=e.text||'';uiState.colorSeed=e.seed??0;syncSeedInput();
  if(e.phantom){uiState.hasEverTyped=false;ta.placeholder=ANIMAL_CELL_TEXT;}
  else{uiState.hasEverTyped=true;ta.placeholder=GENERIC_PLACEHOLDER;}
}
function hundo(){if(hist.ptr<=0)return;hist.ptr--;_applyEntry(hist.stack[hist.ptr]);syncUI();render();}
function hredo(){if(hist.ptr>=hist.stack.length-1)return;hist.ptr++;_applyEntry(hist.stack[hist.ptr]);syncUI();render();}
function syncH(){
  document.getElementById('btn-und').disabled=hist.ptr<=0;
  document.getElementById('btn-red').disabled=hist.ptr>=hist.stack.length-1;
}

/* ══ HORIZONTAL LIMIT CONTROLS ══ */
function intOnlyKeydown(e){
  const nav=['Backspace','Delete','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Tab','Enter','Home','End'];
  if(nav.includes(e.key)||e.ctrlKey||e.metaKey)return;
  if(/^\d$/.test(e.key))return;
  e.preventDefault();
}
function syncHlimitUI(){
  const cb=document.getElementById('hlimit-cb');
  const ni=document.getElementById('hlimit-inp');
  const au=document.getElementById('btn-hlup'),ad=document.getElementById('btn-hldn');
  cb.checked=!hlimitInf;
  ni.disabled=hlimitInf;au.disabled=hlimitInf||hlimitN>=hlimitCap(d1Max);ad.disabled=hlimitInf||hlimitN<=1;
  ni.value=hlimitN;
}
function applyHlimit(inf,n){
  hlimitInf=inf;if(!inf)hlimitN=Math.max(1,Math.min(hlimitCap(d1Max),Math.round(isNaN(n)?1:n)));
  syncHlimitUI();render();
  if(!uiState.userTouchedCanvas&&st.lay)animateFit(300);
}
document.getElementById('hlimit-cb').addEventListener('change',e=>applyHlimit(!e.target.checked,hlimitN));
document.getElementById('hlimit-inp').addEventListener('focus',e=>e.target.select());
document.getElementById('hlimit-inp').addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.target.blur();return;}intOnlyKeydown(e);
});
document.getElementById('hlimit-inp').addEventListener('input',e=>{
  const v=parseInt(e.target.value,10);if(!isNaN(v))applyHlimit(false,v);
});
document.getElementById('hlimit-inp').addEventListener('blur',e=>{
  const v=parseInt(e.target.value,10);applyHlimit(false,isNaN(v)||v<1?1:v);
});
document.getElementById('btn-hlup').addEventListener('click',()=>applyHlimit(false,hlimitN+1));
document.getElementById('btn-hldn').addEventListener('click',()=>applyHlimit(false,hlimitN-1));
syncHlimitUI();

/* ══ RENDER ══ */
let rtimer=null;
function schedRender(){clearTimeout(rtimer);rtimer=setTimeout(render,C.RENDER_DEBOUNCE);}
function render(){
  const text=ta.value;
  const isBlank=!text.trim();
  if(isBlank){
    if(!uiState.hasEverTyped){
      const pl=getPhantomLay();
      if(pl){
        const nd=pl.root.children.length||1;
        if(nd!==d1Max){d1Max=nd;if(hlimitN>hlimitCap(d1Max))hlimitN=hlimitCap(d1Max);syncHlimitUI();}
        st.lay=pl;emptyEl.style.display='none';if(!uiState.userTouchedCanvas)autoFit();draw();
        if(document.activeElement!==seedInp)seedInp.value=uiState.colorSeed;
      }
    }else{
      if(d1Max!==1){d1Max=1;if(hlimitN>1)hlimitN=1;syncHlimitUI();}
      st.lay=null;uiState.userTouchedCanvas=false;emptyEl.style.display='flex';draw();
    }
    syncUI();return;
  }
  const root=parse(text);if(!root)return;
  const nd=root.children.length||1;
  if(nd!==d1Max){
    const prevCap=hlimitCap(d1Max);d1Max=nd;
    const newCap=hlimitCap(d1Max);
    if(hlimitInf&&hlimitN===prevCap)hlimitN=newCap;
    if(hlimitN>newCap)hlimitN=newCap;
    syncHlimitUI();
  }
  const prevLay=st.lay;
  st.lay=layout(root,uiState.colorSeed);emptyEl.style.display='none';
  if(uiState.userTouchedCanvas&&prevLay&&st.lay.MD!==prevLay.MD)preserveViewportAcrossLayoutChange(prevLay,st.lay);
  if(!uiState.userTouchedCanvas)autoFit();
  draw();
  if(document.activeElement!==seedInp)seedInp.value=uiState.colorSeed;
  syncUI();
}

/* ══ TEXTAREA EVENTS ══ */
function stripBulletsFromLines(text){
  return text.split('\n').map(line=>{
    const m=line.match(/^(\s*)([-*•+#>]\s+)(?=\S)/);
    return m?m[1]+line.slice(m[1].length+m[2].length):line;
  }).join('\n');
}
function normaliseIndentInText(text){
  return text.split('\n').map(line=>{
    const ws=line.match(/^([\t ]*)/)[1];
    if(!ws)return line;
    let sp=0;for(const c of ws)sp+=c==='\t'?2:1;
    const newWS='\t'.repeat(sp>>1)+(sp&1?' ':'');
    return newWS===ws?line:newWS+line.slice(ws.length);
  }).join('\n');
}
function applyBulletStrip(){
  const original=ta.value,stripped=stripBulletsFromLines(original);
  if(stripped===original)return false;
  const cursor=ta.selectionStart;
  let removed=0,pos=0;
  const oldLines=original.split('\n'),newLines=stripped.split('\n');
  for(let i=0;i<oldLines.length;i++){
    const lineEnd=pos+oldLines[i].length;
    if(pos>=cursor)break;
    removed+=oldLines[i].length-newLines[i].length;
    pos=lineEnd+1;
  }
  ta.value=stripped;ta.selectionStart=ta.selectionEnd=Math.max(0,cursor-removed);
  return true;
}
function applyLeadingNorm(text,cursor){
  const newText=normaliseIndentInText(text);
  if(newText===text)return{text,cursor};
  const origLines=text.split('\n'),newLines=newText.split('\n');
  let origOffset=0,cumDelta=0,newCursor=cursor;
  for(let i=0;i<origLines.length;i++){
    const ws=origLines[i].match(/^([\t ]*)/)[1];
    const nws=newLines[i].match(/^([\t ]*)/)[1];
    const delta=nws.length-ws.length;
    const lineStart=origOffset,wsEnd=lineStart+ws.length;
    if(cursor<=wsEnd){newCursor=lineStart+cumDelta+nws.length;break;}
    if(cursor<=lineStart+origLines[i].length){newCursor=cursor+cumDelta+delta;break;}
    cumDelta+=delta;origOffset+=origLines[i].length+1;
  }
  return{text:newText,cursor:Math.max(0,newCursor)};
}
ta.addEventListener('beforeinput',e=>{
  if(e.inputType==='historyUndo'){e.preventDefault();hundo();}
  else if(e.inputType==='historyRedo'){e.preventDefault();hredo();}
});
ta.addEventListener('input',e=>{
  if(e.inputType==='historyUndo'){hundo();return;}
  if(e.inputType==='historyRedo'){hredo();return;}
  if(!uiState.hasEverTyped){uiState.userTouchedCanvas=false;if(ta.value.trim())setTyped();}
  applyBulletStrip();
  const norm=applyLeadingNorm(ta.value,ta.selectionStart);
  if(norm.text!==ta.value){ta.value=norm.text;ta.selectionStart=ta.selectionEnd=norm.cursor;}
  syncClear();schedRender();hpush(ta.value,uiState.colorSeed);
});
function normalizePasteText(text){
  return normaliseIndentInText(stripBulletsFromLines(text.replace(/\r\n/g,'\n').replace(/\r/g,'\n')));
}
ta.addEventListener('paste',e=>{
  e.preventDefault();
  const raw=normalizePasteText((e.clipboardData||window.clipboardData).getData('text'));
  const s=ta.selectionStart,end=ta.selectionEnd;
  ta.value=ta.value.substring(0,s)+raw+ta.value.substring(end);
  ta.selectionStart=ta.selectionEnd=s+raw.length;
  const wasInitial=!uiState.hasEverTyped;
  if(!uiState.hasEverTyped&&raw.trim())setTyped();
  if(wasInitial)uiState.userTouchedCanvas=false;
  render();if(wasInitial&&st.lay)animateFit(300);
  hpushBreak(ta.value,uiState.colorSeed);
});

/* ══ OUTLINER INDENT / OUTDENT HELPERS ══ */
function _getLineIdx(text,lineStart){return text.substring(0,lineStart).split('\n').length-1;}
function _wsUnits(ws){let u=0;for(const c of ws)u+=c==='\t'?2:1;return u;}
function _outlineIndent(text,cursorPos,lineStart,leadSp){
  const lines=text.split('\n'),idx=_getLineIdx(text,lineStart);
  const curUnits=_wsUnits(lines[idx].match(/^([\t ]*)/)[1]);
  const isEmptyLine=!lines[idx].trim();
  lines[idx]='\t'+lines[idx];
  if(!isEmptyLine)for(let i=idx+1;i<lines.length;i++){
    if(!lines[i].trim())continue;
    if(_wsUnits(lines[i].match(/^([\t ]*)/)[1])>curUnits)lines[i]='\t'+lines[i];else break;
  }
  return{text:lines.join('\n'),cursor:cursorPos+1};
}

function _outlineSpaceIndent(text,cursorPos,lineStart){
  const lines=text.split('\n'),idx=_getLineIdx(text,lineStart);
  const curUnits=_wsUnits(lines[idx].match(/^([\t ]*)/)[1]);
  const isEmptyLine=!lines[idx].trim();
  lines[idx]=' '+lines[idx];
  if(!isEmptyLine)for(let i=idx+1;i<lines.length;i++){
    if(!lines[i].trim())continue;
    if(_wsUnits(lines[i].match(/^([\t ]*)/)[1])>curUnits)lines[i]=' '+lines[i];else break;
  }
  return{text:lines.join('\n'),cursor:cursorPos+1};
}
function _outlineSpaceOutdent(text,cursorPos,lineStart){
  const lines=text.split('\n'),idx=_getLineIdx(text,lineStart);
  const curWS=lines[idx].match(/^([\t ]*)/)[1];
  const curUnits=_wsUnits(curWS);
  if(!curUnits)return null;
  const isEmptyLine=!lines[idx].trim();
  const removeUnits=curWS[curWS.length-1]==='\t'?2:1;
  const nu=curUnits-removeUnits;
  const nws=nu<=0?'':'\t'.repeat(nu>>1)+(nu&1?' ':'');
  lines[idx]=nws+lines[idx].slice(curWS.length);
  if(!isEmptyLine)for(let i=idx+1;i<lines.length;i++){
    if(!lines[i].trim())continue;
    const cws=lines[i].match(/^([\t ]*)/)[1];
    const cu=_wsUnits(cws);
    if(cu>curUnits){const cn=cu-removeUnits,cnws=cn<=0?'':'\t'.repeat(cn>>1)+(cn&1?' ':'');lines[i]=cnws+lines[i].slice(cws.length);}
    else break;
  }
  return{text:lines.join('\n'),cursor:Math.max(lineStart,cursorPos+(nws.length-curWS.length))};
}
ta.addEventListener('keydown',e=>{
  const s=ta.selectionStart,end=ta.selectionEnd,text=ta.value;
  const _ls=text.slice(0,s).lastIndexOf('\n')+1;
  const _le=text.indexOf('\n',s),_lt=text.substring(_ls,_le===-1?text.length:_le);
  const _lsp=_lt.match(/^\t*/)[0].length,_col=s-_ls;
  const _leadWSFull=_lt.match(/^([\t ]*)/)[1].length;
  if(e.key==='Tab'){
    e.preventDefault();
    if(s===end&&!e.metaKey&&!e.ctrlKey&&!e.altKey){
      const r=_outlineIndent(text,s,_ls,_lsp);ta.value=r.text;ta.selectionStart=ta.selectionEnd=r.cursor;
    }else{ta.value=text.substring(0,s)+'\t'+text.substring(end);ta.selectionStart=ta.selectionEnd=s+1;}
    schedRender();hpushBreak(ta.value,uiState.colorSeed);return;
  }
  if(e.key===' '&&s===end&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&_col<=_leadWSFull){
    e.preventDefault();
    const r=_outlineSpaceIndent(text,s,_ls);ta.value=r.text;ta.selectionStart=ta.selectionEnd=r.cursor;
    const norm=applyLeadingNorm(ta.value,ta.selectionStart);
    if(norm.text!==ta.value){ta.value=norm.text;ta.selectionStart=ta.selectionEnd=norm.cursor;}
    schedRender();hpushBreak(ta.value,uiState.colorSeed);return;
  }
  if(e.key==='Backspace'&&s===end&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&_col>=1&&_col<=_leadWSFull){
    e.preventDefault();
    const r=_outlineSpaceOutdent(text,s,_ls);
    if(r){ta.value=r.text;ta.selectionStart=ta.selectionEnd=r.cursor;schedRender();hpushBreak(ta.value,uiState.colorSeed);}
    return;
  }
  if(e.key==='Enter'){
    e.preventDefault();
    const lineStart=text.slice(0,s).lastIndexOf('\n')+1;
    const lineContent=text.substring(lineStart,s);
    const curIndent=lineContent.match(/^([\t ]*)/)[1];
    const lineText=lineContent.trim();
    if(lineText!==''){
      const ins='\n'+curIndent;
      ta.value=text.substring(0,s)+ins+text.substring(end);ta.selectionStart=ta.selectionEnd=s+ins.length;
    }else{
      if(curIndent.length>0){
        ta.value=text.substring(0,lineStart)+text.substring(lineStart+1);
        ta.selectionStart=ta.selectionEnd=Math.max(lineStart,s-1);
      }else{ta.value=text.substring(0,s)+'\n'+text.substring(end);ta.selectionStart=ta.selectionEnd=s+1;}
    }
    scrollToCursor();schedRender();hpushBreak(ta.value,uiState.colorSeed);return;
  }
  if((e.metaKey||e.ctrlKey)&&e.key==='z'&&!e.shiftKey){e.preventDefault();hundo();}
  if((e.metaKey||e.ctrlKey)&&(e.key==='y'||(e.key==='z'&&e.shiftKey))){e.preventDefault();hredo();}
});
function scrollToCursor(){
  const pos=ta.selectionStart,text=ta.value;
  const ls=text.slice(0,pos).lastIndexOf('\n')+1;
  _cx.font='12px "Cascadia Code","JetBrains Mono",monospace';
  const cx=_cx.measureText(text.substring(ls,pos)).width,pad=12;
  if(cx<ta.scrollLeft+pad)ta.scrollLeft=Math.max(0,cx-pad);
}
function snapCursorToContent(){
  const pos=ta.selectionStart;if(pos!==ta.selectionEnd)return;
  const text=ta.value;
  const ls=text.slice(0,pos).lastIndexOf('\n')+1;
  const le=text.indexOf('\n',ls);
  const lineText=text.substring(ls,le===-1?text.length:le);
  const fi=lineText.search(/\S/);if(fi<0)return;
  const cs=ls+fi;if(pos<cs)ta.selectionStart=ta.selectionEnd=cs;
  scrollToCursor();
}
ta.addEventListener('focus',()=>{if(isPhantonMode())ta.scrollTop=0;setTimeout(scrollToCursor,0);});
ta.addEventListener('click',()=>setTimeout(snapCursorToContent,0));
ta.addEventListener('touchend',()=>setTimeout(snapCursorToContent,0));
document.getElementById('btn-und').addEventListener('click',hundo);
document.getElementById('btn-red').addEventListener('click',hredo);

let _cpyTimer=null;
function textWithBullets(text){
  return text.split('\n').map(line=>{const m=line.match(/^(\t+)/);return m?m[1]+'- '+line.slice(m[1].length):line;}).join('\n');
}
btnCpy.addEventListener('click',()=>{
  if(btnCpy.classList.contains('copied'))return;
  navigator.clipboard.writeText(textWithBullets(ta.value)).catch(()=>{});
  btnCpy.classList.add('copied');btnCpy.innerHTML='✓ Copied!';
  clearTimeout(_cpyTimer);
  _cpyTimer=setTimeout(()=>{btnCpy.classList.remove('copied');btnCpy.innerHTML='⧉ Copy';},1000);
});
btnClr.addEventListener('click',()=>{
  ta.value='';uiState.colorSeed=0;syncSeedInput();
  if(!uiState.hasEverTyped){uiState.hasEverTyped=true;ta.placeholder=GENERIC_PLACEHOLDER;}
  hpushBreak('',0);render();setTimeout(()=>btnClr.blur(),0);
});
btnPdf.addEventListener('click',()=>{exportPDF().catch(err=>console.error('PDF export:',err));});
document.getElementById('btn-rnd').addEventListener('click',()=>{
  uiState.colorSeed=Math.floor(Math.random()*0xFFFFFF);syncSeedInput();
  hpushBreak(ta.value,uiState.colorSeed);render();
  setTimeout(()=>document.getElementById('btn-rnd').blur(),0);
});
seedInp.addEventListener('focus',()=>seedInp.select());
seedInp.addEventListener('keydown',e=>{if(e.key==='Enter')seedInp.blur();});
seedInp.addEventListener('blur',()=>{
  const v=seedInp.value.trim();
  if(v!==''){uiState.colorSeed=Math.max(0,parseInt(v,10)||0);hpushBreak(ta.value,uiState.colorSeed);render();}
  syncSeedInput();
});
btnRst.addEventListener('click',()=>{
  uiState.userTouchedCanvas=false;
  if(isPhantonMode()&&!st.lay){const pl=getPhantomLay();if(pl)st.lay=pl;}
  if(st.lay)animateFit(C.ANIM_RST);setTimeout(()=>btnRst.blur(),0);
});
btnTog.addEventListener('click',()=>{
  const wasOff=panel.classList.contains('off');
  panel.classList.toggle('off');btnTog.classList.toggle('off');
  if(wasOff)setPanelWidth(DEFAULT_PANEL_W);
  updateEmptyHint();
  if(!uiState.userTouchedCanvas&&st.lay)animateFit(260);
  setTimeout(()=>btnTog.blur(),0);
});

/* ══ PANEL RESIZE ══ */
function getMinPanelW(){
  const isOff=panel.classList.contains('off');
  const creditEl=panel.querySelector('.credit');
  const creditMin=(!creditEl||isOff)?0:Math.ceil(creditEl.offsetLeft+creditEl.offsetWidth+44+8);
  let hlimitMin=0;
  if(!isOff){
    const lbl=document.querySelector('#hlimit-row .rl-lbl'),cb=document.getElementById('hlimit-cb-lbl');
    const hldn=document.getElementById('btn-hldn'),hlup=document.getElementById('btn-hlup');
    hlimitMin=(lbl?lbl.offsetWidth:0)+20+(hldn?hldn.offsetWidth:28)+(hlup?hlup.offsetWidth:28)+32+20+(cb?cb.offsetWidth:0)+28;
  }
  return Math.max(creditMin,hlimitMin);
}
function getMaxPanelW(){return Math.max(DEFAULT_PANEL_W,window.innerWidth-24);}
function setPanelWidth(w){
  panelW=Math.max(getMinPanelW(),Math.min(getMaxPanelW(),w));
  document.documentElement.style.setProperty('--pw',panelW+'px');updateEmptyHint();
}
let _panAnimId=null;
function animatePanelWidth(targetW,dur=C.ANIM_PANEL){
  targetW=Math.max(getMinPanelW(),Math.min(getMaxPanelW(),targetW));
  cancelAnimationFrame(_panAnimId);cancelAnimationFrame(_raf);_raf=null;
  panel.style.transform='';btnTog.style.left='';document.body.classList.add('rh-active');
  const fromW=panelW,t0=performance.now();
  const doFit=!uiState.userTouchedCanvas&&st.lay&&!panel.classList.contains('off');
  let fS,fX,fY,tS,tX,tY;
  if(doFit){const savedW=panelW;panelW=targetW;const ft=fitTarget();panelW=savedW;fS=st.scale;fX=st.panX;fY=st.panY;tS=ft.scale;tX=ft.panX;tY=ft.panY;}
  function step(now){
    const p=Math.min(1,(now-t0)/dur),e=easeOut3(p);
    setPanelWidth(Math.round(fromW+(targetW-fromW)*e));
    if(doFit){st.scale=fS+(tS-fS)*e;st.panX=fX+(tX-fX)*e;st.panY=fY+(tY-fY)*e;}
    redraw();
    if(p<1){_panAnimId=requestAnimationFrame(step);}
    else{requestAnimationFrame(()=>document.body.classList.remove('rh-active'));}
  }
  _panAnimId=requestAnimationFrame(step);
}
function _rhStart(cx){
  cancelAnimationFrame(_panAnimId);rhState.drag={startX:cx,startW:panelW};rhState.offset=0;
  rhEl.classList.add('rh-active');document.body.classList.add('rh-active');
  document.body.style.cursor='ew-resize';document.body.style.userSelect='none';document.body.style.webkitUserSelect='none';
  panel.style.willChange='transform';
}
function _rhMove(cx){
  if(!rhState.drag)return;
  const newW=rhState.drag.startW+(cx-rhState.drag.startX),minW=getMinPanelW();
  if(newW>=minW){
    rhState.offset=0;panel.style.left='';panel.style.transform='';btnTog.style.left='';
    setPanelWidth(Math.abs(newW-DEFAULT_PANEL_W)<28?DEFAULT_PANEL_W:newW);
    if(!uiState.userTouchedCanvas&&st.lay&&!panel.classList.contains('off')){const ft=fitTarget();st.scale=ft.scale;st.panX=ft.panX;st.panY=ft.panY;}
  }else{
    setPanelWidth(minW);rhState.offset=minW-newW;
    panel.style.left=`-${rhState.offset}px`;panel.style.transform='';
    btnTog.style.left=`${minW-44-rhState.offset}px`;
    if(!uiState.userTouchedCanvas&&st.lay){const ft=fitTarget(kbLift.h,Math.max(0,minW-rhState.offset));st.scale=ft.scale;st.panX=ft.panX;st.panY=ft.panY;}
  }
  redraw();
}
function _rhEnd(){
  if(!rhState.drag)return;
  rhEl.classList.remove('rh-active');document.body.style.cursor='';document.body.style.userSelect='';document.body.style.webkitUserSelect='';
  rhState.drag=null;const offset=rhState.offset;rhState.offset=0;const minW=panelW;
  if(offset>minW*0.42)_rhAnimCollapse(offset,minW);
  else if(offset>0)_rhAnimSnapBack(offset);
  else{requestAnimationFrame(()=>document.body.classList.remove('rh-active'));if(!uiState.userTouchedCanvas&&st.lay)animateFit(200);redraw();}
}
function _rhAnimCollapse(fromOff,minW){
  cancelAnimationFrame(_panAnimId);const t0=performance.now(),dur=C.ANIM_PANEL;
  function step(now){
    const p=Math.min(1,(now-t0)/dur),e=easeOut3(p),off=fromOff+(minW-fromOff)*e;
    panel.style.left=`${-off}px`;btnTog.style.left=`${minW-44-off}px`;redraw();
    if(p<1){_panAnimId=requestAnimationFrame(step);}
    else{
      panel.classList.add('off');btnTog.classList.add('off');panel.style.left='';btnTog.style.left='';
      btnTog.style.opacity='0';setPanelWidth(DEFAULT_PANEL_W);updateEmptyHint();
      requestAnimationFrame(()=>{
        document.body.classList.remove('rh-active');
        if(!uiState.userTouchedCanvas&&st.lay)animateFit(260);redraw();
        requestAnimationFrame(()=>{btnTog.style.transition='opacity 0.5s ease';btnTog.style.opacity='';setTimeout(()=>{btnTog.style.transition='';},510);});
      });
    }
  }
  _panAnimId=requestAnimationFrame(step);
}
function _rhAnimSnapBack(fromOff){
  cancelAnimationFrame(_panAnimId);const t0=performance.now(),dur=220;
  function step(now){
    const p=Math.min(1,(now-t0)/dur),e=easeOut3(p),off=fromOff*(1-e);
    if(off>0.5){panel.style.left=`${-off}px`;btnTog.style.left=`${panelW-44-off}px`;}
    else{panel.style.left='';btnTog.style.left='';}
    redraw();
    if(p<1){_panAnimId=requestAnimationFrame(step);}
    else{document.body.classList.remove('rh-active');if(!uiState.userTouchedCanvas&&st.lay)animateFit(200);}
  }
  _panAnimId=requestAnimationFrame(step);
}
const rhEl=document.getElementById('resize-handle');
rhEl.addEventListener('mousedown',e=>{
  e.preventDefault();e.stopPropagation();
  const now=Date.now();
  if(now-rhState.lastTap<320){animatePanelWidth(DEFAULT_PANEL_W,200);rhState.lastTap=0;return;}
  rhState.lastTap=now;_rhStart(e.clientX);
});
window.addEventListener('mousemove',e=>{if(!rhState.drag)return;e.preventDefault();_rhMove(e.clientX);},{passive:false});
window.addEventListener('mouseup',()=>{if(rhState.drag)_rhEnd();});
rhEl.addEventListener('touchstart',e=>{
  e.preventDefault();e.stopPropagation();
  const now=Date.now(),t=e.touches[0];
  if(now-rhState.lastTap<320){animatePanelWidth(DEFAULT_PANEL_W,200);rhState.lastTap=0;return;}
  rhState.lastTap=now;_rhStart(t.clientX);
},{passive:false});
rhEl.addEventListener('touchmove',e=>{e.preventDefault();if(rhState.drag)_rhMove(e.touches[0].clientX);},{passive:false});
rhEl.addEventListener('touchend',()=>{if(rhState.drag)_rhEnd();});

/* ══ VIRTUAL KEYBOARD ══ */
const _isTouch='ontouchstart' in window||navigator.maxTouchPoints>0;
function _kbVisH(){return window.visualViewport?Math.min(window.innerHeight,window.visualViewport.height):window.innerHeight;}
function _kbSetPos(kbH){if(emptyEl)emptyEl.style.transform=kbH>40?`translateY(${(-(kbH/2)).toFixed(1)}px)`:''; }
function _kbBezier(p){
  const x1=0.38,y1=0.70,x2=0.125,y2=1.00;let t=p;
  for(let i=0;i<8;i++){const bx=3*(1-t)*(1-t)*t*x1+3*(1-t)*t*t*x2+t*t*t;const dbx=3*(1-t)*(1-t)*x1+6*(1-t)*t*(x2-x1)+3*t*t*(1-x2);if(Math.abs(dbx)<1e-6)break;t-=(bx-p)/dbx;}
  return 3*(1-t)*(1-t)*t*y1+3*(1-t)*t*t*y2+t*t*t;
}
function _kbAnimateTo(targetH){
  if(Math.abs(targetH-kbLift.targetH)<2)return;kbLift.targetH=targetH;
  cancelAnimationFrame(kbLift.animId);cancelAnimationFrame(_raf);_raf=null;
  const fromH=kbLift.h,dur=C.ANIM_KB,t0=performance.now();
  let fmS,fmX,fmY,toS,toX,toY,doFit=false;
  if(st.lay&&!uiState.userTouchedCanvas){doFit=true;fmS=st.scale;fmX=st.panX;fmY=st.panY;const ft=fitTarget(targetH);toS=ft.scale;toX=ft.panX;toY=ft.panY;}
  function step(now){
    const p=Math.min(1,(now-t0)/dur),e=easeOut3(p);
    kbLift.h=fromH+(targetH-fromH)*e;_kbSetPos(kbLift.h);
    if(doFit){st.scale=fmS+(toS-fmS)*e;st.panX=fmX+(toX-fmX)*e;st.panY=fmY+(toY-fmY)*e;}
    redraw();
    if(p<1){kbLift.animId=requestAnimationFrame(step);}else{kbLift.h=targetH;_kbSetPos(targetH);kbLift.animId=null;}
  }
  kbLift.animId=requestAnimationFrame(step);
}
function _kbAnimateBtn(targetH){
  if(Math.abs(targetH-kbLift.btnTarget)<2)return;kbLift.btnTarget=targetH;
  cancelAnimationFrame(kbLift.btnAnimId);
  const fromH=kbLift.btnH,dur=C.ANIM_KB_BTN,t0=performance.now();
  function step(now){
    const p=Math.min(1,(now-t0)/dur),e=_kbBezier(p);
    kbLift.btnH=fromH+(targetH-fromH)*e;
    if(btnRst)btnRst.style.bottom=(14+Math.round(kbLift.btnH))+'px';
    if(p<1){kbLift.btnAnimId=requestAnimationFrame(step);}else{kbLift.btnH=targetH;if(btnRst)btnRst.style.bottom=(14+Math.round(targetH))+'px';kbLift.btnAnimId=null;}
  }
  kbLift.btnAnimId=requestAnimationFrame(step);
}
function _kbUpdate(){const target=Math.max(0,window.innerHeight-_kbVisH());_kbAnimateTo(target);_kbAnimateBtn(target);}
if(_isTouch){
  if(window.visualViewport){window.visualViewport.addEventListener('resize',_kbUpdate);window.visualViewport.addEventListener('scroll',_kbUpdate);}
  window.addEventListener('resize',_kbUpdate);
}

/* ══ PRESS-STATE & DRAG-GUARD ══ */
(()=>{
  const T=C.BTN_DRAG_THRESH;let _b=null,_sx=0,_sy=0,_dr=false;
  const end=()=>{if(_b)_b.classList.remove('pressing');_b=null;};
  document.addEventListener('mousedown',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;_b=b;_sx=e.clientX;_sy=e.clientY;_dr=false;b.classList.add('pressing');},{capture:true});
  document.addEventListener('mousemove',e=>{if(_b&&Math.hypot(e.clientX-_sx,e.clientY-_sy)>T){_dr=true;_b.classList.remove('pressing');}});
  document.addEventListener('mouseout',e=>{if(_b&&e.target===_b){_dr=true;_b.classList.remove('pressing');}});
  document.addEventListener('mouseup',end,{capture:true});
  document.addEventListener('click',e=>{if(!_dr)return;const b=e.target.closest('button');if(b){e.stopImmediatePropagation();e.preventDefault();_dr=false;}},{capture:true});
  document.addEventListener('touchstart',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;_b=b;_sx=e.touches[0].clientX;_sy=e.touches[0].clientY;_dr=false;b.classList.add('pressing');},{capture:true,passive:true});
  document.addEventListener('touchend',e=>{const b=_b,t=e.changedTouches[0];end();if(b&&Math.hypot(t.clientX-_sx,t.clientY-_sy)>T)_dr=true;},{capture:true});
})();

/* ══ EXPAND / COLLAPSE TEXTAREA ══ */
(()=>{
  const zone=document.getElementById('exp-zone'),btn=document.getElementById('btn-exp');
  const EXP=`<svg width="11" height="11" viewBox="0 0 11 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M10 4V1H7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M1 7V10H4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const COL=`<svg width="11" height="11" viewBox="0 0 11 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7 1V4H10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 10V7H1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  btn.innerHTML=EXP;
  let expanded=false,pressing=false,moved=false,sx=0,sy=0;
  const THRESH=C.EXPAND_THRESH;
  function _applyFixed(top,left,w,h,tr){
    Object.assign(zone.style,{position:'fixed',top:top+'px',left:left+'px',width:w+'px',height:h+'px',
      zIndex:'200',padding:'14px',gap:'8px',background:'var(--bg-panel)',boxSizing:'border-box',
      display:'flex',flexDirection:'column',overflow:'hidden',transition:tr||'none'});
  }
  function expand(){
    expanded=true;const rect=zone.getBoundingClientRect();
    _applyFixed(rect.top,rect.left,rect.width,rect.height,'none');zone.classList.add('expanded');zone.offsetHeight;
    const e='cubic-bezier(.16,1,.3,1)',d='.52s';
    zone.style.transition=`top ${d} ${e},left ${d} ${e},width ${d} ${e},height ${d} ${e}`;
    zone.style.top='0';zone.style.left='0';zone.style.width=window.innerWidth+'px';zone.style.height=window.innerHeight+'px';
    btn.innerHTML=COL;btn.title='Collapse';btnTog.style.visibility='hidden';
  }
  function collapse(){
    expanded=false;zone.classList.remove('expanded');
    btn.innerHTML=EXP;btn.title='Expand';btnTog.style.visibility='';
    zone.removeAttribute('style');const target=zone.getBoundingClientRect();
    _applyFixed(0,0,window.innerWidth,window.innerHeight,'none');zone.offsetHeight;
    const e='cubic-bezier(.16,1,.3,1)',d='.36s';
    zone.style.transition=`top ${d} ${e},left ${d} ${e},width ${d} ${e},height ${d} ${e},padding ${d} ${e}`;
    zone.style.top=target.top+'px';zone.style.left=target.left+'px';
    zone.style.width=target.width+'px';zone.style.height=target.height+'px';zone.style.padding='0';
    setTimeout(()=>{zone.removeAttribute('style');},380);
  }
  function toggle(){expanded?collapse():expand();}
  btn.addEventListener('mousedown',e=>{e.preventDefault();e.stopPropagation();pressing=true;moved=false;sx=e.clientX;sy=e.clientY;btn.classList.add('pressing');});
  window.addEventListener('mousemove',e=>{if(!pressing)return;if(Math.hypot(e.clientX-sx,e.clientY-sy)>THRESH){moved=true;btn.classList.remove('pressing');}});
  window.addEventListener('mouseup',()=>{if(!pressing)return;btn.classList.remove('pressing');if(!moved)toggle();pressing=false;moved=false;});
  btn.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();pressing=true;moved=false;sx=e.touches[0].clientX;sy=e.touches[0].clientY;btn.classList.add('pressing');},{passive:false});
  window.addEventListener('touchmove',e=>{if(!pressing)return;const t=e.touches[0];if(Math.hypot(t.clientX-sx,t.clientY-sy)>THRESH){moved=true;btn.classList.remove('pressing');}},{passive:true});
  window.addEventListener('touchend',()=>{if(!pressing)return;btn.classList.remove('pressing');if(!moved)toggle();pressing=false;moved=false;});
  window.addEventListener('keydown',e=>{if(e.key==='Escape'&&expanded)collapse();});
})();

/* ══ INIT ══ */
syncUI();
setPanelWidth(panelW);
setTimeout(()=>{
  if(isIPhonePortrait()){DEFAULT_PANEL_W=getMinPanelW();if(Math.abs(panelW-DEFAULT_PANEL_W)>1)setPanelWidth(DEFAULT_PANEL_W);}
},30);
window.addEventListener('resize',()=>{
  if(!panel.classList.contains('off')&&panelW>getMaxPanelW())setPanelWidth(getMaxPanelW());
  resizeCanvas();
});
resizeCanvas();
setTimeout(render,60);
</script>
